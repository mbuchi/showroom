<!doctype html>
<!-- No theme class here. The pre-paint bootstrap injected by aireonHtmlPlugin is
     the only writer of the first frame (docs/THEME_STANDARD.md section 2b), and it
     already honors showroom's dark default via `defaultTheme: 'dark'` in
     vite.config.ts. A static class used to be unremovable, so a visitor whose
     stored choice was light got a first frame of class=dark + data-theme=light and
     light mode flipped back on every load. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://hub.aireon.ch/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="https://hub.aireon.ch/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://hub.aireon.ch/favicon-32x32.png" />
    <meta name="theme-color" content="#08090b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <!-- No font or SSO <link> hints here on purpose. Fonts are self-hosted through
         @aireon/shared/fonts.css (see src/main.tsx), and the pre-paint theme
         bootstrap plus the preconnects the first screen actually uses are injected
         at build time by aireonHtmlPlugin in vite.config.ts. See
         aireon-shared/docs/PERFORMANCE_STANDARD.md. -->
    <title>showroom - Free Real Estate Report Builder</title>
    <meta name="description" content="Assemble a property report from all aireon services instantly" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Showroom - gallery for your parcel exports" />
    <meta property="og:description" content="Assemble a property report from all aireon services instantly" />
    <meta property="og:url" content="https://showroom.aireon.ch/" />
    <meta property="og:image" content="https://hub.aireon.ch/meta/showroom.jpg" />
    <meta property="og:image:secure_url" content="https://hub.aireon.ch/meta/showroom.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2080" />
    <meta property="og:image:height" content="1172" />
    <meta property="og:image:alt" content="Showroom - gallery for your parcel exports" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Showroom - gallery for your parcel exports" />
    <meta name="twitter:description" content="Assemble a property report from all aireon services instantly" />
    <meta name="twitter:image" content="https://hub.aireon.ch/meta/showroom.jpg" />
    <meta name="twitter:image:alt" content="Showroom - gallery for your parcel exports" />
  </head>
  <body class="bg-ink-950 text-gray-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
